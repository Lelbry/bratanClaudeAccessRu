# tinyproxy config for LocalProxyForClaude
# Bound to localhost only - accessible ONLY via SSH tunnel from Windows PC.
# Место на сервере: /etc/tinyproxy/tinyproxy.conf

User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 300
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 200
StartServers 5
MinSpareServers 5
MaxSpareServers 20

# Только localhost может подключаться (через SSH-туннель)
Allow 127.0.0.1

# CONNECT-порты (только Claude/HTTPS)
# 443/563/8443 - обычный HTTPS
# 80          - HTTP CONNECT (некоторые клиенты)
ConnectPort 443
ConnectPort 563
ConnectPort 8443
ConnectPort 80
